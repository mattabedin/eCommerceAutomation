<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Forge — AI Store Builder</title>
  <link rel="stylesheet" href="styles.css?v=4"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx?v=3"></script>
  <script type="text/babel" src="data.jsx?v=3"></script>
  <script type="text/babel" src="shell.jsx?v=4"></script>
  <script type="text/babel" src="builder.jsx?v=3"></script>
  <script type="text/babel" src="preview.jsx?v=3"></script>
  <script type="text/babel" src="views.jsx?v=3"></script>
  <script type="text/babel" src="publishing.jsx?v=1"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Sidebar, Topbar } = window.FORGE_NAV;
    const { BuilderChat } = window.FORGE_BUILDER;
    const { StorefrontFrame } = window.FORGE_PREVIEW;
    const { Publishing } = window.FORGE_PUBLISHING;
    const V = window.FORGE_VIEWS;
    const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle, TweakSelect, TweakColor, TweakButton } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "accent": "#6366F1",
      "brand": "pawluxe",
      "view": "publishing",
      "device": "desktop",
      "approvalGate": true,
      "showAIBadges": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [view, setView] = useState(tweaks.view);
      const [device, setDevice] = useState(tweaks.device);
      const [brandKey, setBrandKey] = useState(tweaks.brand);
      const [buildState, setBuildState] = useState({ active: -1, blueprint: null, status: 'idle' });

      // sync tweaks → state
      useEffect(() => { setBrandKey(tweaks.brand); }, [tweaks.brand]);
      useEffect(() => { setView(tweaks.view); }, [tweaks.view]);
      useEffect(() => { setDevice(tweaks.device); }, [tweaks.device]);

      // theme
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
      }, [tweaks.theme]);

      // accent var
      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accent);
        // also tint accent-soft based on accent
        const r = parseInt(tweaks.accent.slice(1, 3), 16);
        const g = parseInt(tweaks.accent.slice(3, 5), 16);
        const b = parseInt(tweaks.accent.slice(5, 7), 16);
        const soft = tweaks.theme === 'light'
          ? `rgba(${r},${g},${b},0.10)`
          : `rgba(${r},${g},${b},0.18)`;
        document.documentElement.style.setProperty('--accent-soft', soft);
      }, [tweaks.accent, tweaks.theme]);

      const brand = FORGE.BRANDS[brandKey];

      const handleApprove = () => {
        setView('dashboard');
        setTweak('view', 'dashboard');
      };

      const renderView = () => {
        if (view === 'builder') {
          return (
            <div className="builder-split">
              <BuilderChat
                brand={brand}
                brandKey={brandKey}
                setBrandKey={(k) => { setBrandKey(k); setTweak('brand', k); }}
                buildState={buildState}
                setBuildState={setBuildState}
                onApprove={handleApprove}
                gateApproval={tweaks.approvalGate}
              />
              <StorefrontFrame
                brand={brand}
                brandKey={brandKey}
                buildState={buildState}
                device={device}
                setDevice={(d) => { setDevice(d); setTweak('device', d); }}
              />
            </div>
          );
        }
        if (view === 'preview') {
          return <StorefrontFrame brand={brand} brandKey={brandKey} buildState={{ active: 99, status: 'ready' }} device={device} setDevice={setDevice}/>;
        }
        if (view === 'publishing') return <Publishing brand={brand} brandKey={brandKey}/>;
        if (view === 'dashboard') return <V.Dashboard brand={brand} brandKey={brandKey}/>;
        if (view === 'products')  return <V.Products brand={brand} brandKey={brandKey}/>;
        if (view === 'orders')    return <V.Orders/>;
        if (view === 'customers') return <V.Customers/>;
        if (view === 'marketing') return <V.Marketing/>;
        if (view === 'support')   return <V.Support brand={brand}/>;
        if (view === 'analytics') return <V.Analytics/>;
        if (view === 'settings')  return <V.Settings brand={brand}/>;
        if (view === 'billing')   return <V.Billing/>;
        return null;
      };

      return (
        <>
          <div className="app">
            <Sidebar
              view={view}
              setView={(v) => { setView(v); setTweak('view', v); }}
              brand={brand}
              openSwitch={() => {
                const next = brandKey === 'pawluxe' ? 'desknova' : 'pawluxe';
                setBrandKey(next);
                setTweak('brand', next);
              }}
            />
            <main className="main">
              <Topbar view={view} brand={brand} theme={tweaks.theme} setTheme={(t) => setTweak('theme', t)}/>
              <div className="content">
                {renderView()}
              </div>
            </main>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Appearance">
              <TweakRadio label="Theme" value={tweaks.theme} options={[{ label: 'Light', value: 'light' }, { label: 'Dark', value: 'dark' }]} onChange={v => setTweak('theme', v)}/>
              <TweakColor label="Accent" value={tweaks.accent} onChange={v => setTweak('accent', v)}/>
            </TweakSection>

            <TweakSection label="Workspace">
              <TweakSelect label="Brand" value={tweaks.brand} options={[{ label: 'PawLuxe Co. (pet)', value: 'pawluxe' }, { label: 'DeskNova (office)', value: 'desknova' }]} onChange={v => setTweak('brand', v)}/>
              <TweakSelect label="View" value={tweaks.view} options={[
                { label: 'AI Builder', value: 'builder' },
                { label: 'Storefront', value: 'preview' },
                { label: 'Publishing', value: 'publishing' },
                { label: 'Dashboard', value: 'dashboard' },
                { label: 'Products',  value: 'products' },
                { label: 'Orders',    value: 'orders' },
                { label: 'Customers', value: 'customers' },
                { label: 'Marketing', value: 'marketing' },
                { label: 'Support',   value: 'support' },
                { label: 'Analytics', value: 'analytics' },
                { label: 'Settings',  value: 'settings' },
                { label: 'Billing',   value: 'billing' },
              ]} onChange={v => setTweak('view', v)}/>
              <TweakRadio label="Preview device" value={tweaks.device} options={[{ label: 'Desktop', value: 'desktop' }, { label: 'Mobile', value: 'mobile' }]} onChange={v => setTweak('device', v)}/>
            </TweakSection>

            <TweakSection label="Behavior">
              <TweakToggle label="Approval gate" value={tweaks.approvalGate} onChange={v => setTweak('approvalGate', v)}/>
              <TweakToggle label="AI badges" value={tweaks.showAIBadges} onChange={v => setTweak('showAIBadges', v)}/>
            </TweakSection>

            <TweakSection label="Demo">
              <TweakButton label="Replay build sequence" onClick={() => { setTweak('view', 'builder'); setBuildState({ active: -1, blueprint: null, status: 'idle' }); setTimeout(() => location.reload(), 100); }}/>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
